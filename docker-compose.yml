x-backend-common: &backend-common
  build:
    context: ./packages/backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  # ──────────────────────────────────────────────
  #  Frontend
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  # ──────────────────────────────────────────────
  #  API Gateway
  # ──────────────────────────────────────────────
  api-gateway:
    <<: *backend-common
    environment:
      SERVICE: api_gateway
      GATEWAY_MONITORING_SVC_URL: http://monitoring-svc:8000
      GATEWAY_PIPELINE_SVC_URL: http://pipeline-svc:8000
      GATEWAY_SERVING_SVC_URL: http://serving-svc:8000
      GATEWAY_MLOPS_SVC_URL: http://mlops-svc:8000
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_CORS_ORIGINS: '["http://localhost:5173"]'
      AUTH_VERIFY_TOKEN: "false"
      GATEWAY_AUTH_VERIFY_TOKEN: "false"
    ports:
      - "8000:8000"

  # ──────────────────────────────────────────────
  #  Monitoring Service
  # ──────────────────────────────────────────────
  monitoring-svc:
    <<: *backend-common
    environment:
      SERVICE: monitoring_svc
      MONITORING_PROMETHEUS_URL: http://prometheus:9090
      MONITORING_LOKI_URL: http://loki:3100
      MONITORING_TEMPO_URL: http://tempo:3200
      MONITORING_ALERTMANAGER_URL: http://alertmanager:9093
      MONITORING_REDIS_URL: redis://redis:6379/1
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alertmanager:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  Pipeline Service
  # ──────────────────────────────────────────────
  pipeline-svc:
    <<: *backend-common
    environment:
      SERVICE: pipeline_svc
      PIPELINE_AIRBYTE_URL: http://airbyte-server:8001
      PIPELINE_PREFECT_URL: http://prefect-server:4200
      PIPELINE_SPARK_URL: http://spark-master:8080
      PIPELINE_REDIS_URL: redis://redis:6379/2
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  Serving Service
  # ──────────────────────────────────────────────
  serving-svc:
    <<: *backend-common
    environment:
      SERVICE: serving_svc
      SERVING_PROMETHEUS_URL: http://prometheus:9090
      SERVING_REDIS_URL: redis://redis:6379/3
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  MLOps Service
  # ──────────────────────────────────────────────
  mlops-svc:
    <<: *backend-common
    environment:
      SERVICE: mlops_svc
      MLOPS_MLFLOW_URL: http://mlflow:5000
      MLOPS_AIRFLOW_URL: http://airflow-webserver:8080
      MLOPS_AIRFLOW_USERNAME: admin
      MLOPS_AIRFLOW_PASSWORD: admin
    ports:
      - "8004:8000"
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  Shared Infrastructure
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # ──────────────────────────────────────────────
  #  Monitoring Stack
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./docker/configs/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.4.0
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/configs/tempo.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./docker/configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  MLOps Stack
  # ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlops:mlops@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow/artifacts
    entrypoint: ["sh", "-c"]
    command:
      - |
        pip install --quiet psycopg2-binary &&
        mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri postgresql://mlops:mlops@postgres:5432/mlflow \
          --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.9.0
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - airflow-logs:/opt/airflow/logs
    command: ["standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  Pipeline Stack
  # ──────────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:2-python3.11
    ports:
      - "4200:4200"
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  mlflow-data:
  airflow-logs:
