apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "component" "frontend") | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
