apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-svc
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
    {{- include "mlops-platform.selectorLabels" (dict "component" "pipeline-svc") | nindent 4 }}
spec:
  replicas: {{ .Values.pipelineSvc.replicas }}
  selector:
    matchLabels:
      {{- include "mlops-platform.selectorLabels" (dict "component" "pipeline-svc") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlops-platform.labels" . | nindent 8 }}
        {{- include "mlops-platform.selectorLabels" (dict "component" "pipeline-svc") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: pipeline-svc
          image: {{ include "mlops-platform.image" (dict "svc" .Values.pipelineSvc "global" .Values.global "name" "pipeline-svc") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.pipelineSvc.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pipeline-svc-config
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pipelineSvc.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pipelineSvc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pipelineSvc.resources | nindent 12 }}
