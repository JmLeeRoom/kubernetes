apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "component" "api-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
      protocol: TCP
