apiVersion: v1
kind: Service
metadata:
  name: mlops-svc
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "component" "mlops-svc") | nindent 4 }}
  ports:
    - port: {{ .Values.mlopsSvc.port }}
      targetPort: {{ .Values.mlopsSvc.port }}
      protocol: TCP
