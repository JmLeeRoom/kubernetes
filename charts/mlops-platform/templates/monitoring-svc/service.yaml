apiVersion: v1
kind: Service
metadata:
  name: monitoring-svc
  labels:
    {{- include "mlops-platform.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mlops-platform.selectorLabels" (dict "component" "monitoring-svc") | nindent 4 }}
  ports:
    - port: {{ .Values.monitoringSvc.port }}
      targetPort: {{ .Values.monitoringSvc.port }}
      protocol: TCP
