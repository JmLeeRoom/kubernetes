global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: /health
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "monitoring-svc"
    metrics_path: /health
    static_configs:
      - targets: ["monitoring-svc:8000"]

  - job_name: "pipeline-svc"
    metrics_path: /health
    static_configs:
      - targets: ["pipeline-svc:8000"]

  - job_name: "serving-svc"
    metrics_path: /health
    static_configs:
      - targets: ["serving-svc:8000"]

  - job_name: "mlops-svc"
    metrics_path: /health
    static_configs:
      - targets: ["mlops-svc:8000"]
